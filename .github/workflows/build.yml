name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          echo "SYSROOT=$HOME/sdks/iPhoneOS16.5.sdk" >> $GITHUB_ENV

      - name: Build tweak
        run: make package FINALPACKAGE=1

      - name: Collect dylibs
        run: |
          mkdir -p artifacts
          find .theos -name "*.dylib" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-dylibs
          path: artifacts/*.dylib
