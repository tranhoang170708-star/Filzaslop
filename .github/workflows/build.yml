name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos + tools
        run: |
          set -e
          brew install ldid xz dpkg make
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          set -e
          git clone --depth 1 https://github.com/theos/sdks.git "${{ github.workspace }}/sdks"
          SDK=$(ls -d "${{ github.workspace }}/sdks/"iPhoneOS*.sdk | sort -V | tail -1)
          echo "Using SDK: $SDK"
          echo "SYSROOT=$SDK" >> "$GITHUB_ENV"

      - name: Diagnose Theos layout
        run: |
          set +e
          echo "=== THEOS: $THEOS ==="
          echo "=== makefiles/ (top-level) ==="
          ls -la "$THEOS/makefiles/" 2>&1 | head -40
          echo "=== makefiles/master/ ==="
          ls -la "$THEOS/makefiles/master/" 2>&1 | head -40
          echo "=== top-level tweak.mk exists? ==="
          if [ -f "$THEOS/makefiles/tweak.mk" ]; then echo "YES"; else echo "NO"; fi
          echo "=== master/tweak.mk exists? ==="
          if [ -f "$THEOS/makefiles/master/tweak.mk" ]; then echo "YES"; else echo "NO"; fi
          echo "=== shim example: library.mk ==="
          cat "$THEOS/makefiles/library.mk" 2>&1 || echo "LIBRARY.MK MISSING"
          echo "=== shim example: bundle.mk ==="
          cat "$THEOS/makefiles/bundle.mk" 2>&1 || echo "BUNDLE.MK MISSING"
          echo "=== Makefile include lines ==="
          grep -n "include" Makefile 2>&1 || echo "GREP FAILED"
          echo "=== END DIAGNOSE ==="
          exit 0

      - name: Patch Makefile for new Theos layout
        run: |
          set +e
          if [ -f "$THEOS/makefiles/master/tweak.mk" ] && [ ! -f "$THEOS/makefiles/tweak.mk" ]; then
            echo "Patching Makefile: tweak.mk -> master/tweak.mk"
            sed -i '' 's|$(THEOS_MAKE_PATH)/tweak.mk|$(THEOS_MAKE_PATH)/master/tweak.mk|' Makefile
            echo "--- new Makefile includes ---"
            grep -n "include" Makefile
          else
            echo "No patch needed."
          fi
          exit 0

      - name: Build tweak
        run: |
          set +e
          make clean 2>&1 || true
          make package FINALPACKAGE=1 2>&1
          BUILD_EXIT=$?
          echo "=== build exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== .theos dir listing ==="
            ls -la .theos/ 2>&1 || true
            echo "=== searching for any .dylib built ==="
            find .theos -name "*.dylib" 2>&1 || true
          fi
          exit $BUILD_EXIT

      - name: Collect dylibs
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          find .theos -name "*.dylib" -exec cp {} artifacts/ \; 2>&1 || true
          echo "--- artifacts ---"
          ls -la artifacts/ 2>&1 || true
          echo "--- count ---"
          ls artifacts/ 2>/dev/null | wc -l
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilzaSlop-dylibs
          path: artifacts/
          if-no-files-found: warn
