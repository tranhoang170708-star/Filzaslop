name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  THEOS: ${{ github.workspace }}/theos

defaults:
  run:
    working-directory: ${{ github.workspace }}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: .

      - name: Install Theos + tools
        run: |
          set -e
          echo "=== CWD after checkout ==="
          pwd
          ls -la
          echo "=== end ls ==="
          brew install ldid xz dpkg make
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDK
        run: |
          set -e
          git clone --depth 1 https://github.com/theos/sdks.git "${{ github.workspace }}/sdks"
          SDK=$(ls -d "${{ github.workspace }}/sdks/"iPhoneOS*.sdk | sort -V | tail -1)
          echo "Using SDK: $SDK"
          echo "SYSROOT=$SDK" >> "$GITHUB_ENV"

      - name: Diagnose CWD and Makefile
        run: |
          set +e
          echo "=== pwd ==="
          pwd
          echo "=== github.workspace ==="
          echo "${{ github.workspace }}"
          echo "=== ls -la here ==="
          ls -la
          echo "=== find Makefile anywhere ==="
          find "${{ github.workspace }}" -maxdepth 3 -name "Makefile" 2>/dev/null
          echo "=== Makefile includes (if found) ==="
          if [ -f "${{ github.workspace }}/Makefile" ]; then
            grep -n "include" "${{ github.workspace }}/Makefile"
          else
            echo "NO MAKEFILE at workspace root"
          fi
          echo "=== END ==="
          exit 0

      - name: Build tweak
        run: |
          set +e
          cd "${{ github.workspace }}"
          echo "=== pwd before build ==="
          pwd
          ls -la | head -30
          echo "=== make clean ==="
          make clean 2>&1 || true
          echo "=== make package ==="
          make package FINALPACKAGE=1 2>&1
          BUILD_EXIT=$?
          echo "=== exit: $BUILD_EXIT ==="
          exit $BUILD_EXIT

      - name: Collect dylibs
        if: always()
        run: |
          set +e
          cd "${{ github.workspace }}"
          mkdir -p artifacts
          find .theos -name "*.dylib" -exec cp {} artifacts/ \; 2>&1 || true
          ls -la artifacts/
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilzaSlop-dylibs
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: warn
