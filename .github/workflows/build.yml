name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos + tools
        run: |
          brew install ldid xz dpkg make
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git ${{ github.workspace }}/sdks
          SDK=$(ls -d ${{ github.workspace }}/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "Using SDK: $SDK"
          echo "SYSROOT=$SDK" >> $GITHUB_ENV

      - name: Diagnose Theos layout
        run: |
          echo "=== THEOS: $THEOS ==="
          echo "=== makefiles/master/ ==="
          ls -la $THEOS/makefiles/master/
          echo "=== top-level tweak.mk exists? ==="
          test -f $THEOS/makefiles/tweak.mk && echo "YES" || echo "NO"
          echo "=== master/tweak.mk exists? ==="
          test -f $THEOS/makefiles/master/tweak.mk && echo "YES" || echo "NO"
          echo "=== shim content: library.mk ==="
          cat $THEOS/makefiles/library.mk
          echo "=== Makefile include lines ==="
          grep -n "include" Makefile

      - name: Patch Makefile for new Theos layout
        run: |
          if [ -f "$THEOS/makefiles/master/tweak.mk" ] && [ ! -f "$THEOS/makefiles/tweak.mk" ]; then
            echo "Patching Makefile: tweak.mk -> master/tweak.mk"
            sed -i '' 's|$(THEOS_MAKE_PATH)/tweak.mk|$(THEOS_MAKE_PATH)/master/tweak.mk|' Makefile
            grep -n "include" Makefile
          else
            echo "No patch needed (tweak.mk exists at top level, or master version missing)"
          fi

      - name: Build tweak
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Collect dylibs
        run: |
          mkdir -p artifacts
          find .theos -name "*.dylib" -exec cp {} artifacts/ \;
          echo "--- artifacts ---"
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-dylibs
          path: artifacts/*.dylib
