name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos + tools
        run: |
          brew install ldid xz dpkg make
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git ${{ github.workspace }}/sdks
          SDK=$(ls -d ${{ github.workspace }}/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "Using SDK: $SDK"
          echo "SYSROOT=$SDK" >> $GITHUB_ENV

      - name: Debug THEOS
        run: |
          echo "THEOS=$THEOS"
          echo "--- theos dir ---"
          ls -la $THEOS/ | head -20
          echo "--- makefiles ---"
          ls -la $THEOS/makefiles/ | head -20
          echo "--- common.mk exists? ---"
          test -f $THEOS/makefiles/common.mk && echo "YES" || echo "NO"

      - name: Build tweak
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Collect dylibs
        run: |
          mkdir -p artifacts
          find .theos -name "*.dylib" -exec cp {} artifacts/ \;
          echo "--- artifacts ---"
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-dylibs
          path: artifacts/*.dylib
